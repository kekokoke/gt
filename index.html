<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Turismo Record</title>

<style>
:root {
    --bg: #111318;
    --panel: #1b1e25;
    --panel2: #242832;
    --border: #343a46;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4da3ff;
    --gold: #e6b84a;
    --silver: #bfc5cc;
    --bronze: #c98b5b;
    --danger: #e45d5d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

header {
    padding: 24px;
    background: #0d0f13;
    border-bottom: 1px solid var(--border);
}

header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

header p {
    margin: 0;
    color: var(--muted);
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

.game-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.game-tab {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.game-tab:hover {
    background: var(--panel2);
}

.game-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.section-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.section-tab {
    padding: 11px 18px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
}

.section-tab.active {
    background: #303744;
    border-color: var(--accent);
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
}

.stat-title {
    color: var(--muted);
    font-size: 13px;
}

.stat-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 6px;
}

.progress {
    height: 6px;
    background: #30343d;
    border-radius: 3px;
    margin-top: 12px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
}

.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
}

.panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.panel-header h2 {
    margin: 0;
    font-size: 20px;
}

button {
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    padding: 8px 13px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.15);
}

button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

button.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
}

.search {
    width: 100%;
    padding: 11px;
    margin-bottom: 12px;
    background: #101217;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
}

th {
    color: var(--muted);
    font-size: 13px;
}

td {
    font-size: 14px;
}

tr:hover {
    background: rgba(255,255,255,0.025);
}

.status {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
}

.status.gold {
    color: #111;
    background: var(--gold);
}

.status.silver {
    color: #111;
    background: var(--silver);
}

.status.bronze {
    color: #111;
    background: var(--bronze);
}

.status.none {
    color: var(--muted);
    background: #30343d;
}

.actions {
    display: flex;
    gap: 5px;
}

.empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 10px;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
}

.modal h2 {
    margin-top: 0;
}

.form-row {
    margin-bottom: 13px;
}

.form-row label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 5px;
}

.form-row input,
.form-row select,
.form-row textarea {
    width: 100%;
    padding: 10px;
    background: #101217;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
}

.form-row textarea {
    min-height: 90px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
}

.hidden {
    display: none !important;
}

@media (max-width: 800px) {
    .dashboard {
        grid-template-columns: 1fr;
    }

    table {
        min-width: 700px;
    }

    .table-wrapper {
        overflow-x: auto;
    }
}
</style>
</head>

<body>

<header>
    <h1>🏎️ Gran Turismo Record</h1>
    <p>Gran Turismo 1 - 7 Personal Record</p>
</header>

<div class="container">

    <!-- GT selection -->
    <div class="game-tabs">
        <button class="game-tab active" data-game="GT1">GT1</button>
        <button class="game-tab" data-game="GT2">GT2</button>
        <button class="game-tab" data-game="GT3">GT3</button>
        <button class="game-tab" data-game="GT4">GT4</button>
        <button class="game-tab" data-game="GT5">GT5</button>
        <button class="game-tab" data-game="GT6">GT6</button>
        <button class="game-tab" data-game="GT7">GT7</button>
    </div>

    <!-- Section selection -->
    <div class="section-tabs">
        <button class="section-tab active" data-section="cars">
            🚗 Cars
        </button>

        <button class="section-tab" data-section="races">
            🏁 Races
        </button>

        <button class="section-tab" data-section="licenses">
            🪪 Licenses
        </button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="stat">
            <div class="stat-title">Cars</div>
            <div class="stat-value" id="carStat">0 / 0</div>
            <div class="progress">
                <div class="progress-bar" id="carProgress"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">Races</div>
            <div class="stat-value" id="raceStat">0</div>
            <div class="progress">
                <div class="progress-bar" id="raceProgress"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">Licenses</div>
            <div class="stat-value" id="licenseStat">0</div>
            <div class="progress">
                <div class="progress-bar" id="licenseProgress"></div>
            </div>
        </div>

    </div>

    <!-- Cars -->
    <div id="carsSection" class="panel">

        <div class="panel-header">
            <h2>🚗 Car Collection - <span class="game-name">GT1</span></h2>
            <button class="primary" onclick="openCarModal()">
                ＋ Add Car
            </button>
        </div>

        <input
            class="search"
            id="carSearch"
            placeholder="Search car..."
            oninput="render()"
        >

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Obtained</th>
                        <th>Manufacturer</th>
                        <th>Car</th>
                        <th>Year</th>
                        <th>Date</th>
                        <th>Memo</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="carTable"></tbody>
            </table>
        </div>

    </div>

    <!-- Races -->
    <div id="racesSection" class="panel hidden">

        <div class="panel-header">
            <h2>🏁 Race Record - <span class="game-name">GT1</span></h2>

            <button class="primary" onclick="openRaceModal()">
                ＋ Add Race
            </button>
        </div>

        <input
            class="search"
            id="raceSearch"
            placeholder="Search race..."
            oninput="render()"
        >

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Course</th>
                        <th>Car</th>
                        <th>Result</th>
                        <th>Best Lap</th>
                        <th>Date</th>
                        <th>Memo</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="raceTable"></tbody>
            </table>
        </div>

    </div>

    <!-- Licenses -->
    <div id="licensesSection" class="panel hidden">

        <div class="panel-header">
            <h2>🪪 License Record - <span class="game-name">GT1</span></h2>

            <button class="primary" onclick="openLicenseModal()">
                ＋ Add License
            </button>
        </div>

        <input
            class="search"
            id="licenseSearch"
            placeholder="Search license..."
            oninput="render()"
        >

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>License</th>
                        <th>Test</th>
                        <th>Course</th>
                        <th>Result</th>
                        <th>Your Time</th>
                        <th>Date</th>
                        <th>Memo</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="licenseTable"></tbody>
            </table>
        </div>

    </div>

</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">

    <div class="modal">

        <h2 id="modalTitle">Add</h2>

        <!-- Car form -->
        <form id="carForm" class="hidden">

            <div class="form-row">
                <label>Manufacturer</label>
                <input id="carManufacturer" required>
            </div>

            <div class="form-row">
                <label>Car Name</label>
                <input id="carName" required>
            </div>

            <div class="form-row">
                <label>Year</label>
                <input id="carYear">
            </div>

            <div class="form-row">
                <label>Obtained</label>
                <select id="carObtained">
                    <option value="true">Yes</option>
                    <option value="false">No</option>
                </select>
            </div>

            <div class="form-row">
                <label>Date</label>
                <input type="date" id="carDate">
            </div>

            <div class="form-row">
                <label>Memo</label>
                <textarea id="carMemo"></textarea>
            </div>

            <div class="modal-buttons">
                <button type="button" onclick="closeModal()">Cancel</button>
                <button class="primary" type="submit">Save</button>
            </div>

        </form>

        <!-- Race form -->
        <form id="raceForm" class="hidden">

            <div class="form-row">
                <label>Event</label>
                <input id="raceEvent" required>
            </div>

            <div class="form-row">
                <label>Course</label>
                <input id="raceCourse">
            </div>

            <div class="form-row">
                <label>Car</label>
                <input id="raceCar">
            </div>

            <div class="form-row">
                <label>Result</label>
                <input id="raceResult" placeholder="1st / 2nd / DNF ...">
            </div>

            <div class="form-row">
                <label>Best Lap</label>
                <input id="raceLap" placeholder="1:23.456">
            </div>

            <div class="form-row">
                <label>Date</label>
                <input type="date" id="raceDate">
            </div>

            <div class="form-row">
                <label>Memo</label>
                <textarea id="raceMemo"></textarea>
            </div>

            <div class="modal-buttons">
                <button type="button" onclick="closeModal()">Cancel</button>
                <button class="primary" type="submit">Save</button>
            </div>

        </form>

        <!-- License form -->
        <form id="licenseForm" class="hidden">

            <div class="form-row">
                <label>License</label>
                <input id="licenseName" placeholder="B / A / IB / IA / S" required>
            </div>

            <div class="form-row">
                <label>Test</label>
                <input id="licenseTest" placeholder="B-1" required>
            </div>

            <div class="form-row">
                <label>Course</label>
                <input id="licenseCourse">
            </div>

            <div class="form-row">
                <label>Result</label>
                <select id="licenseResult">
                    <option value="Gold">Gold</option>
                    <option value="Silver">Silver</option>
                    <option value="Bronze">Bronze</option>
                    <option value="None">Not Passed</option>
                </select>
            </div>

            <div class="form-row">
                <label>Your Time</label>
                <input id="licenseTime" placeholder="1:23.456">
            </div>

            <div class="form-row">
                <label>Date</label>
                <input type="date" id="licenseDate">
            </div>

            <div class="form-row">
                <label>Memo</label>
                <textarea id="licenseMemo"></textarea>
            </div>

            <div class="modal-buttons">
                <button type="button" onclick="closeModal()">Cancel</button>
                <button class="primary" type="submit">Save</button>
            </div>

        </form>

    </div>
</div>

<script>

const STORAGE_KEY = "gran_turismo_record_v1";

let db = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
) || {
    GT1: { cars: [], races: [], licenses: [] },
    GT2: { cars: [], races: [], licenses: [] },
    GT3: { cars: [], races: [], licenses: [] },
    GT4: { cars: [], races: [], licenses: [] },
    GT5: { cars: [], races: [], licenses: [] },
    GT6: { cars: [], races: [], licenses: [] },
    GT7: { cars: [], races: [], licenses: [] }
};

let currentGame = "GT1";
let currentSection = "cars";
let editId = null;

function saveDB() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );
}

function createId() {
    return Date.now().toString(36) +
        Math.random().toString(36).substring(2);
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function selectGame(game) {

    currentGame = game;

    document.querySelectorAll(".game-tab").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.game === game
        );
    });

    document.querySelectorAll(".game-name").forEach(element => {
        element.textContent = game;
    });

    render();
}

function selectSection(section) {

    currentSection = section;

    document.querySelectorAll(".section-tab").forEach(button => {
        button.classList.toggle(
            "active",
            button.dataset.section === section
        );
    });

    document.getElementById("carsSection")
        .classList.toggle("hidden", section !== "cars");

    document.getElementById("racesSection")
        .classList.toggle("hidden", section !== "races");

    document.getElementById("licensesSection")
        .classList.toggle("hidden", section !== "licenses");

    render();
}

document.querySelectorAll(".game-tab").forEach(button => {
    button.addEventListener("click", () => {
        selectGame(button.dataset.game);
    });
});

document.querySelectorAll(".section-tab").forEach(button => {
    button.addEventListener("click", () => {
        selectSection(button.dataset.section);
    });
});

function render() {

    renderCars();
    renderRaces();
    renderLicenses();
    renderStats();
}

function renderCars() {

    const search =
        document.getElementById("carSearch")
            .value.toLowerCase();

    const cars = db[currentGame].cars.filter(car => {

        const text = [
            car.manufacturer,
            car.name,
            car.year,
            car.memo
        ].join(" ").toLowerCase();

        return text.includes(search);
    });

    const tbody = document.getElementById("carTable");

    if (cars.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No car records.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML = cars.map(car => `

        <tr>

            <td>
                <input
                    type="checkbox"
                    ${car.obtained ? "checked" : ""}
                    onchange="toggleCar('${car.id}')"
                >
            </td>

            <td>${escapeHTML(car.manufacturer)}</td>

            <td><strong>${escapeHTML(car.name)}</strong></td>

            <td>${escapeHTML(car.year)}</td>

            <td>${escapeHTML(car.date)}</td>

            <td>${escapeHTML(car.memo)}</td>

            <td>
                <div class="actions">
                    <button onclick="editCar('${car.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteRecord('cars','${car.id}')"
                    >
                        Delete
                    </button>
                </div>
            </td>

        </tr>

    `).join("");
}

function renderRaces() {

    const search =
        document.getElementById("raceSearch")
            .value.toLowerCase();

    const races = db[currentGame].races.filter(race => {

        const text = [
            race.event,
            race.course,
            race.car,
            race.result,
            race.memo
        ].join(" ").toLowerCase();

        return text.includes(search);
    });

    const tbody = document.getElementById("raceTable");

    if (races.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No race records.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML = races.map(race => `

        <tr>

            <td><strong>${escapeHTML(race.event)}</strong></td>

            <td>${escapeHTML(race.course)}</td>

            <td>${escapeHTML(race.car)}</td>

            <td>${escapeHTML(race.result)}</td>

            <td>${escapeHTML(race.lap)}</td>

            <td>${escapeHTML(race.date)}</td>

            <td>${escapeHTML(race.memo)}</td>

            <td>
                <div class="actions">

                    <button onclick="editRace('${race.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteRecord('races','${race.id}')"
                    >
                        Delete
                    </button>

                </div>
            </td>

        </tr>

    `).join("");
}

function renderLicenses() {

    const search =
        document.getElementById("licenseSearch")
            .value.toLowerCase();

    const licenses =
        db[currentGame].licenses.filter(license => {

            const text = [
                license.name,
                license.test,
                license.course,
                license.result,
                license.memo
            ].join(" ").toLowerCase();

            return text.includes(search);
        });

    const tbody =
        document.getElementById("licenseTable");

    if (licenses.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="empty">
                    No license records.
                </td>
            </tr>
        `;

        return;
    }

    tbody.innerHTML = licenses.map(license => {

        const resultClass =
            license.result.toLowerCase();

        return `

        <tr>

            <td>
                <strong>
                    ${escapeHTML(license.name)}
                </strong>
            </td>

            <td>${escapeHTML(license.test)}</td>

            <td>${escapeHTML(license.course)}</td>

            <td>
                <span class="status ${resultClass}">
                    ${escapeHTML(license.result)}
                </span>
            </td>

            <td>${escapeHTML(license.time)}</td>

            <td>${escapeHTML(license.date)}</td>

            <td>${escapeHTML(license.memo)}</td>

            <td>
                <div class="actions">

                    <button onclick="editLicense('${license.id}')">
                        Edit
                    </button>

                    <button
                        class="danger"
                        onclick="deleteRecord('licenses','${license.id}')"
                    >
                        Delete
                    </button>

                </div>
            </td>

        </tr>

        `;
    }).join("");
}

function renderStats() {

    const data = db[currentGame];

    const totalCars = data.cars.length;
    const obtainedCars =
        data.cars.filter(car => car.obtained).length;

    document.getElementById("carStat").textContent =
        `${obtainedCars} / ${totalCars}`;

    document.getElementById("carProgress").style.width =
        totalCars
            ? `${obtainedCars / totalCars * 100}%`
            : "0%";

    document.getElementById("raceStat").textContent =
        data.races.length;

    document.getElementById("raceProgress").style.width =
        data.races.length ? "100%" : "0%";

    document.getElementById("licenseStat").textContent =
        data.licenses.length;

    document.getElementById("licenseProgress").style.width =
        data.licenses.length ? "100%" : "0%";
}

function openModal(type) {

    editId = null;

    document.getElementById("modalBg")
        .classList.add("show");

    document.getElementById("carForm")
        .classList.toggle("hidden", type !== "cars");

    document.getElementById("raceForm")
        .classList.toggle("hidden", type !== "races");

    document.getElementById("licenseForm")
        .classList.toggle("hidden", type !== "licenses");

    document.getElementById("modalTitle").textContent =
        type === "cars"
            ? "Add Car"
            : type === "races"
                ? "Add Race"
                : "Add License";
}

function closeModal() {

    document.getElementById("modalBg")
        .classList.remove("show");

    document.querySelectorAll("form").forEach(form => {
        form.reset();
    });

    editId = null;
}

function openCarModal() {
    openModal("cars");
}

function openRaceModal() {
    openModal("races");
}

function openLicenseModal() {
    openModal("licenses");
}

document.getElementById("carForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const record = {
            id: editId || createId(),
            manufacturer:
                document.getElementById("carManufacturer").value,
            name:
                document.getElementById("carName").value,
            year:
                document.getElementById("carYear").value,
            obtained:
                document.getElementById("carObtained").value === "true",
            date:
                document.getElementById("carDate").value,
            memo:
                document.getElementById("carMemo").value
        };

        if (editId) {

            const index =
                db[currentGame].cars.findIndex(
                    car => car.id === editId
                );

            db[currentGame].cars[index] = record;

        } else {

            db[currentGame].cars.push(record);
        }

        saveDB();
        closeModal();
        render();
    });

document.getElementById("raceForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const record = {
            id: editId || createId(),
            event:
                document.getElementById("raceEvent").value,
            course:
                document.getElementById("raceCourse").value,
            car:
                document.getElementById("raceCar").value,
            result:
                document.getElementById("raceResult").value,
            lap:
                document.getElementById("raceLap").value,
            date:
                document.getElementById("raceDate").value,
            memo:
                document.getElementById("raceMemo").value
        };

        if (editId) {

            const index =
                db[currentGame].races.findIndex(
                    race => race.id === editId
                );

            db[currentGame].races[index] = record;

        } else {

            db[currentGame].races.push(record);
        }

        saveDB();
        closeModal();
        render();
    });

document.getElementById("licenseForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const record = {
            id: editId || createId(),
            name:
                document.getElementById("licenseName").value,
            test:
                document.getElementById("licenseTest").value,
            course:
                document.getElementById("licenseCourse").value,
            result:
                document.getElementById("licenseResult").value,
            time:
                document.getElementById("licenseTime").value,
            date:
                document.getElementById("licenseDate").value,
            memo:
                document.getElementById("licenseMemo").value
        };

        if (editId) {

            const index =
                db[currentGame].licenses.findIndex(
                    license => license.id === editId
                );

            db[currentGame].licenses[index] = record;

        } else {

            db[currentGame].licenses.push(record);
        }

        saveDB();
        closeModal();
        render();
    });

function toggleCar(id) {

    const car =
        db[currentGame].cars.find(
            car => car.id === id
        );

    if (!car) return;

    car.obtained = !car.obtained;

    saveDB();
    render();
}

function deleteRecord(type, id) {

    if (!confirm("Delete this record?")) {
        return;
    }

    db[currentGame][type] =
        db[currentGame][type].filter(
            item => item.id !== id
        );

    saveDB();
    render();
}

function editCar(id) {

    const car =
        db[currentGame].cars.find(
            item => item.id === id
        );

    if (!car) return;

    editId = id;

    openModal("cars");

    document.getElementById("modalTitle").textContent =
        "Edit Car";

    document.getElementById("carManufacturer").value =
        car.manufacturer;

    document.getElementById("carName").value =
        car.name;

    document.getElementById("carYear").value =
        car.year;

    document.getElementById("carObtained").value =
        String(car.obtained);

    document.getElementById("carDate").value =
        car.date;

    document.getElementById("carMemo").value =
        car.memo;
}

function editRace(id) {

    const race =
        db[currentGame].races.find(
            item => item.id === id
        );

    if (!race) return;

    editId = id;

    openModal("races");

    document.getElementById("modalTitle").textContent =
        "Edit Race";

    document.getElementById("raceEvent").value =
        race.event;

    document.getElementById("raceCourse").value =
        race.course;

    document.getElementById("raceCar").value =
        race.car;

    document.getElementById("raceResult").value =
        race.result;

    document.getElementById("raceLap").value =
        race.lap;

    document.getElementById("raceDate").value =
        race.date;

    document.getElementById("raceMemo").value =
        race.memo;
}

function editLicense(id) {

    const license =
        db[currentGame].licenses.find(
            item => item.id === id
        );

    if (!license) return;

    editId = id;

    openModal("licenses");

    document.getElementById("modalTitle").textContent =
        "Edit License";

    document.getElementById("licenseName").value =
        license.name;

    document.getElementById("licenseTest").value =
        license.test;

    document.getElementById("licenseCourse").value =
        license.course;

    document.getElementById("licenseResult").value =
        license.result;

    document.getElementById("licenseTime").value =
        license.time;

    document.getElementById("licenseDate").value =
        license.date;

    document.getElementById("licenseMemo").value =
        license.memo;
}

render();

</script>
